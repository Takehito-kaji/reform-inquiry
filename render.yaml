# Render の「Blueprint」用の設定。これ1つで Web アプリとデータベースをまとめて作れます
databases:
  - name: reform-inquiry-db
    plan: free
    region: singapore          # 日本から近い地域
    databaseName: reform_inquiry
    user: reform_inquiry

services:
  - type: web
    name: reform-inquiry
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reform-inquiry-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true    # Render が自動で作ります
      - key: BUNDLE_WITHOUT
        value: development:test
      # ↓ Blueprint を作るときに、Render の画面で入力します
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_BOT_TOKEN       # PDFも Slack に送る場合だけ（不要なら空欄）
        sync: false
      - key: SLACK_CHANNEL_ID      # PDFも Slack に送る場合だけ（不要なら空欄）
        sync: false
